<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Generador de PDF - ReadAllComics (cliente)</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      /* Small local styles to ensure the UI looks OK */
      :root {
        --bg: #ffffff;
        --card: #fff;
        --text: #0b0f12;
        --muted: #555;
        --accent: #0078d4;
        --log: #f8f9fb;
      }
      body {
        font-family: system-ui, Segoe UI, Roboto, Arial;
        max-width: 860px;
        margin: 32px auto;
        padding: 0 16px;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        background: var(--card);
        padding: 18px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      button {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 6px;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }
      progress {
        width: 100%;
        height: 18px;
      }
      .small {
        font-size: 0.9rem;
        color: var(--muted);
      }
      .log {
        white-space: pre-wrap;
        margin-top: 8px;
        background: var(--log);
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #eee;
      }

      /* Dark mode variables */
      body.dark {
        --bg: #07101a;
        --card: #071827;
        --text: #e6eef6;
        --muted: #9fb7cc;
        --accent: #0a66c2;
        --log: #02101a;
      }

      /* Dark-mode small adjustments */
      body.dark .card {
        box-shadow: none;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      body.dark input[type="text"],
      body.dark progress {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      body.dark button {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Generador de PDF (cliente)</h1>
    <div class="card">
      <label for="url">URL de la página (readallcomics.com)</label>
      <input
        id="url"
        type="text"
        placeholder="https://readallcomics.com/...?" />

      <div
        style="display: flex; gap: 8px; align-items: center; margin-top: 10px">
        <button id="generate">Generar PDF</button>
        <div class="small" id="status">Estado: esperando</div>
        <button
          id="darkToggle"
          title="Alternar modo oscuro"
          style="margin-left: 8px; background: #444">
          🌙
        </button>
      </div>

      <div style="margin-top: 12px">
        <label>Progreso</label>
        <progress id="progress" value="0" max="100"></progress>
      </div>

      <div class="log" id="log">Mensajes de la aplicación...</div>
    </div>

    <!-- pdf-lib (UMD bundle) -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="js/pdf_generator.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
